<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fratelos.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">Fratelos.exe</div>
  <a id="joinBtn" class="join-btn" href="https://discord.gg/MqgR6yM9qz" target="_blank" rel="noopener">
    <img src="logo.png" alt="Logo" class="join-logo">
    <span>Join</span>
  </a>
  </header>

  <main class="content">
    <div class="page-heading">
      <h1>Explore les projets</h1>
      <p>Clique sur une case pour voir les détails et y accéder.</p>
    </div>

    <section id="grid" class="grid"></section>
  </main>

  <div id="overlay" class="overlay"></div>

  <aside id="panel" class="panel">
    <button id="closeBtn" class="close-btn" aria-label="Fermer">&times;</button>
    <div class="panel-image-wrap">
      <img id="panelImage" src="" alt="">
    </div>
    <div class="panel-body">
      <div id="panelTags" class="panel-tags"></div>
      <h2 id="panelTitle"></h2>
      <p id="panelDesc"></p>
      <a id="panelLink" class="visit-btn" href="#" target="_blank" rel="noopener">
        Visiter le site
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </aside>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
